schema = "storm-n-tracs-editor-line/project/v5"
segment_db = "soya-express.segments.json"
geometry_half_width = 4
geometry_covered_half_width = 1.5
send_definitions = """
axle signal
  sends: H0 H2
  E:   0   0
  Ea:  0   1
  R:   1   2
  T:   18  4
  YY:  30  6
  Y:   50  8
  Yh:  60  9
  YG:  70  10
  YGh: 80  11
  G:   100 12
  Gh:  112 13

condition always() = true
condition hr(NAME) = nt:get_signal(NAME).HR
condition anydest() = utils.someDestination(nt, TRACK)
condition anyroute() = utils.someRouteLock(nt, TRACK)
condition locked() = utils.someDestination(nt, TRACK) or utils.someRouteLock(nt, TRACK)
condition lever(NAME) = nt:get_track(TRACK).relatedLever == NAME
condition destlever(NAME) = nt:get_track(TRACK).destRelatedLever == NAME
condition normal(NAME) = nt:get_switch(NAME):getRealRoute() == require("src.n_tracs_core.switch.set_route").Normal
condition reverse(NAME) = nt:get_switch(NAME):getRealRoute() == require("src.n_tracs_core.switch.set_route").Reverse

aspect
  R: 0
  YY: 1
  Y: 2
  YG: 3
  G: 4

condition signal(NAME) = nt:get_signal(NAME).aspect
"""

[[kinds]]
id = "signal"
name = "信号"
export_tracks = true

[[kinds]]
id = "area_only"
name = "Areaのみ"
export_tracks = false

[[tracks]]
id = "NHB4LT"
kind_id = "signal"
send = """
set sub-1 (sub-2 sub-3)
  LE  ~ L: E Ea
  LEa ~ L: E Ea
  RY  ~ R: E Y
  RYY ~ R: E YY
  RR  ~ R: E R
  LYY ~ L: E YY

-- 仕様書+0.3m点を照査点・速度に設定
check SC_0: at=7.3#L toward=L over=1.5m/s hold=3s
check SC_1: at=9.3#L toward=L over=1.8m/s hold=3s
check SC_2: at=11.3#L toward=L over=2.2m/s hold=3s
check SC_3: at=14.3#L toward=L over=2.5m/s hold=3s
check SC_4: at=17.8#L toward=L over=3.0m/s hold=3s
check SC_5: at=21.3#L toward=L over=3.5m/s hold=3s
check SC_6: at=25.3#L toward=L over=4.0m/s hold=3s
check SC_7: at=30.3#L toward=L over=4.5m/s hold=3s

hr(NHB4R): RY
hr(NHB11R): RYY
anydest(): RR /through
anydest(): LYY
  tripped(SC_0 SC_1 SC_2 SC_3 SC_4 SC_5 SC_6 SC_7): LEa
"""


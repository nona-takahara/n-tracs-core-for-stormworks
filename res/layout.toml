# 連動図表レイアウト設定
# grid: タイル形状グリッド (LR/UD/LD/LU/RD/RU/SW/.)
# switches: "row,col" → 転換器定義 (normal/reverseはTILE_PATHSのキー)
#   label_side (任意): "up"/"down"/"left"/"right" -- 転てつ器番号ラベルの向きを明示指定
# tile_tracks: "row,col" → 軌道回路ID (フラットルックアップ)。'.' 以外の全タイルに必須。
# signals: 信号てこ配置
#   type (任意, 既定 "main"): 信号記号の種別 (build/generate_diagram.js の SIGNAL_GLYPHS を参照)
#   shift (任意, 既定 {x=0,y=0}): タイル単位での記号全体の平行移動
# bumpers: 車止め ("row,col" 相当のタイル位置+ポート)
# fouling_marks: 車両接触限界標識 (row/colは小数可、タイル座標系)
# platforms: ホーム配置 (row/col/width/heightは全てタイル単位、小数可)
# track_label_overrides: 軌道回路ラベルの表示位置の上書き (省略時は自動配置)

[NHB]
# row0: 4番線  row1: 3番線/本線(HLT_NHB1Tが直進で合流)  row2: 2番線/9番線  row3: 1番線
grid = [
  ".   .   .   LR  LR  LD  .   .   .   .   .   .   .",
  "LR  LR  LR  LR  LR  SW  LR  LR  SW  LR  LR  LR  .",
  ".   .   LR  LR  LR  LR  LR  SW  SW  LR  LR  LR  LR",
  ".   .   LR  LR  LR  LR  LR  LU  .   .   .   .   .",
]

[NHB.switches]
"1,5" = { id = "NHB21",  normal = "LR", reverse = "UR", label_side = "up" }
"1,8" = { id = "NHB22A", normal = "LR", reverse = "LD" }
"2,7" = { id = "NHB23",  normal = "LR", reverse = "DR", label_side = "left" }
"2,8" = { id = "NHB22B", normal = "LR", reverse = "UR" }

[NHB.tile_tracks]
"0,3"  = "NHB4LT"
"0,4"  = "NHB4LT"
"0,5"  = "NHB4LT"
"1,0"  = "HLT_NHB1T"
"1,1"  = "HLT_NHB1T"
"1,2"  = "NHB5LT"
"1,3"  = "NHB5LT"
"1,4"  = "NHB5LT"
"1,5"  = "NHB21T"
"1,6"  = "NHB21T"
"1,7"  = "NHB21T"
"1,8"  = "NHB22AT"
"1,9"  = "NHB22AT"
"1,10" = "NHB5RT"
"1,11" = "NHB5RT"
"2,2"  = "NHB6LT"
"2,3"  = "NHB6LT"
"2,4"  = "NHB6LT"
"2,5"  = "NHB6LT"
"2,6"  = "NHB6LT"
"2,7"  = "NHB23T"
"2,8"  = "NHB23T"
"2,9"  = "NHB13RT"
"2,10" = "NHB13RT"
"2,11" = "NHB13RT"
"2,12" = "TKM_NHB1T"
"3,2"  = "NHB14LT"
"3,3"  = "NHB14LT"
"3,4"  = "NHB14LT"
"3,5"  = "NHB14LT"
"3,6"  = "NHB14LT"

[[NHB.bumpers]]
at = { row = 0, col = 3, side = "left" }

[[NHB.bumpers]]
at = { row = 3, col = 2, side = "left" }

# 各転てつ器の分岐の股(V字の内側)に配置
[[NHB.fouling_marks]]
at = { row = 1.35, col = 5.7 }   # 21

[[NHB.fouling_marks]]
